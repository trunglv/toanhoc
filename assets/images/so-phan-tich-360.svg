  <text x="280" y="458" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#5636e0">360 = 2³ · 3² · 5</text>
  <text x="280" y="484" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#4b4870">Số ở cột trái là số bị chia; số ở cột phải là thương nguyên tố</text>
